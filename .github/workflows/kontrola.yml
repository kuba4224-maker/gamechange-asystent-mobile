name: Kontrola typów i selftesty

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Zależności
        run: npm ci

      - name: Kontrola typów
        run: npx tsc --noEmit

      - name: Selftesty
        run: |
          npm install --no-save tsx
          node tests/run-selftests.mjs
